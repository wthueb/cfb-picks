packages:
  - apps/*
  - packages/*
  - tooling/*
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
catalog:
  "@t3-oss/env-core": ^0.13.11
  "@types/node": ^26.2.0
  "@types/nodemailer": ^8.0.1
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  dotenv-cli: ^11.0.0
  drizzle-orm: ^0.45.2
  eslint: ^10.8.1
  next-auth: ^4.24.15
  nodemailer: ^9.0.5
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1
  redis: ^6.2.1
  typescript: ^7.0.2
  typescript-eslint: ^8.67.0
  tslog: ^5.1.0
  zod: ^4.4.3
  "@t3-oss/env-nextjs": ^0.13.11
  "@tanstack/react-query": ^5.80.7
  "@trpc/client": ^11.18.0
  "@trpc/next": ^11.18.0
  "@trpc/react-query": ^11.18.0
  "@trpc/server": ^11.18.0
catalogs:
  react19:
    react: 19.2.8
    react-dom: 19.2.8
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
overrides:
  react: catalog:react19
  react-dom: catalog:react19
peerDependencyRules:
  allowedVersions:
    "next-auth>@auth/core": 0.41.3
    "@auth/core>nodemailer": "9"
    "next-auth>nodemailer": "9"
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-jsx-a11y>eslint": "10"
    "eslint-plugin-react>eslint": "10"
allowBuilds:
  "@prisma/client": false
  "@prisma/engines": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  bufferutil: false
  esbuild: true
  prisma: false
  sharp: true
  utf-8-validate: false
